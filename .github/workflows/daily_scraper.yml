name: Daily Gold Price Scraper

on:
  schedule:
    - cron: "30 2 * * *"   # 08:00 IST
    - cron: "0 5 * * *"    # 10:30 IST
    - cron: "30 11 * * *"  # 17:00 IST
  workflow_dispatch:


jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.scraper.txt
          python -m playwright install chromium

      - name: Run scraper
        env:
          PG_DSN: ${{ secrets.PG_DSN }}
          PYTHONUNBUFFERED: "1"
        run: |
          python rate_scraper_V4.py
